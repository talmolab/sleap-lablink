deployment_name: sleap-lablink
environment: prod
provider: aws
db:
  dbname: lablink_db
  user: lablink
  password: "PLACEHOLDER_DB_PASSWORD" # Injected from GitHub secret at deploy time
  host: localhost
  port: 5432
  table_name: vm_table
machine:
  machine_type: g4dn.xlarge
  repository: https://github.com/talmolab/sleap-tutorial-data
  image: ghcr.io/talmolab/lablink-client-base-image:linux-amd64-latest-test
  ami_id: ami-0601752c11b394251
  software: sleap
app:
  admin_user: admin
  admin_password: "PLACEHOLDER_ADMIN_PASSWORD" # Injected from GitHub secret at deploy time
  region: us-west-2
dns:
  enabled: true
  terraform_managed: false
  domain: lablink.sleap.ai
  zone_id: Z1038183268T83E91AYJF
eip:
  strategy: persistent
ssl:
  provider: cloudflare
  email: ""
  certificate_arn: ""
allocator:
  image_tag: linux-amd64-latest-test
bucket_name: lablink-tf-state-711387140753
startup_script:
  enabled: true
  path: config/custom-startup.sh
  on_error: continue
monitoring:
  enabled: true
  subject_window_patterns: []
  process_allowlist:
    - sleap-train
    - sleap-track
    - sleap-label
  watch_dir: /home/client/Desktop
  sample_interval_seconds: 2
  push_interval_seconds: 60
